<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d0b">
<title>Hearth</title>
<style>
  :root { --bg: #120d0b; --panel: #1d1613; --line: #2f2520; --text: #f4ece6; --dim: #a8968a; --ember: #ff8a3d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: radial-gradient(120% 60% at 50% 110%, #3a1a0c 0%, var(--bg) 60%) fixed; color: var(--text);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px 16px 48px; }
  h1 { font-weight: 300; letter-spacing: .02em; font-size: 34px; margin: 4px 0 2px; }
  .sub { color: var(--dim); margin: 0 0 22px; font-size: 14px; }
  h2 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin: 26px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
           padding: 14px 12px; text-align: left; cursor: pointer; min-height: 52px; }
  button:active { transform: scale(.98); border-color: var(--ember); }
  .scene small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  .wall { padding: 0; overflow: hidden; }
  .wall img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  .wall span { display: block; padding: 8px 10px; font-size: 14px; }
  .wall.on { border-color: var(--ember); }
  .upload { background: linear-gradient(180deg, #ff9a4d, #e2672a); color: #1b0f08; font-weight: 600; text-align: center; border: 0; width: 100%; }
  .pin { display: flex; gap: 10px; }
  input { font: inherit; font-size: 24px; letter-spacing: .4em; text-align: center; width: 100%; padding: 12px; border-radius: 14px;
          border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  #toast { position: fixed; left: 16px; right: 16px; bottom: 18px; background: #2a1f1a; border: 1px solid var(--line); border-radius: 14px;
           padding: 12px 14px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Hearth</h1>
<p class="sub">Your TV, from your phone.</p>

<section id="login" hidden>
  <h2>Code</h2>
  <p class="sub">Open Wallpapers on the TV: the code is under the title.</p>
  <div class="pin"><input id="pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="····"></div>
</section>

<main id="app" hidden>
  <h2>Play</h2>
  <div class="grid" id="scenes"></div>

  <h2>Apps</h2>
  <div class="grid" id="apps"></div>

  <h2>Wallpapers</h2>
  <label><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <button class="upload" id="pick" type="button">Use a photo from this phone</button></label>
  <div class="grid" id="walls" style="margin-top:10px"></div>
</main>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let pin = "";
try { pin = localStorage.getItem("hearth-pin") || ""; } catch (e) {}

function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}

async function api(method, path, params = {}, body) {
  const q = new URLSearchParams({ ...params, pin });
  const res = await fetch(`${path}?${q}`, { method, body });
  if (res.status === 403) { showLogin(); throw new Error("code"); }
  return res;
}

function showLogin() { $("app").hidden = true; $("login").hidden = false; $("pin").focus(); }

function button(label, sub, onTap, cls) {
  const b = document.createElement("button");
  b.textContent = label;
  if (sub) { const s = document.createElement("small"); s.textContent = sub; b.appendChild(s); }
  if (cls) b.className = cls;
  b.onclick = onTap;
  return b;
}

async function load() {
  let state;
  try { state = await (await api("GET", "/api/state")).json(); } catch (e) { return; }
  $("login").hidden = true; $("app").hidden = false;

  const scenes = $("scenes"); scenes.replaceChildren();
  for (const s of state.scenes) {
    scenes.appendChild(button(s.label, s.ready ? "Ready" : "Fetches on first play", async () => {
      await api("POST", "/api/scene", { id: s.id }); toast(`${s.label} on the TV`);
    }, "scene"));
  }
  scenes.appendChild(button("Chess", "vs Dr. Malvek", async () => {
    await api("POST", "/api/chess"); toast("Chess on the TV");
  }, "scene"));

  const apps = $("apps"); apps.replaceChildren();
  for (const a of state.apps.sort((x, y) => x.label.localeCompare(y.label))) {
    apps.appendChild(button(a.label, "", async () => {
      const r = await api("POST", "/api/launch", { pkg: a.pkg });
      toast(r.ok ? `Opening ${a.label}` : `Couldn't open ${a.label}`);
    }));
  }

  const walls = $("walls"); walls.replaceChildren();
  for (const w of state.wallpapers) {
    const b = document.createElement("button");
    b.className = "wall" + (w.name === state.current ? " on" : "");
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = w.title;
    img.src = `/api/thumb?${new URLSearchParams({ name: w.name, pin })}`;
    const span = document.createElement("span"); span.textContent = w.title;
    b.append(img, span);
    b.onclick = async () => { await api("POST", "/api/wallpaper", { name: w.name }); toast(`${w.title} on the TV`); load(); };
    walls.appendChild(b);
  }
}

$("pin").addEventListener("input", (e) => {
  const v = e.target.value.replace(/\D/g, "");
  e.target.value = v;
  if (v.length === 4) { pin = v; try { localStorage.setItem("hearth-pin", v); } catch (err) {} load(); }
});

$("pick").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) { toast("That photo is over 10 MB"); return; }
  toast("Sending…");
  const r = await api("POST", "/api/upload", { name: f.name }, f);
  toast(r.ok ? "Now on the TV" : "The TV couldn't read that photo");
  e.target.value = "";
  load();
};

if (pin) load(); else showLogin();
</script>
</body>
</html>
