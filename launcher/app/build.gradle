plugins {
    id 'com.android.application'
}

// Release signing: a properties file outside the repo (storeFile, storePassword, keyAlias, keyPassword), at
// $HEARTH_SIGNING or ~/.config/hearth/signing.properties. Without one, release builds use the debug key.
def signing = new Properties()
def signingFile = file(System.getenv('HEARTH_SIGNING') ?: "${System.getProperty('user.home')}/.config/hearth/signing.properties")
if (signingFile.isFile()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'io.github.srikarmk.hearth'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('io.github.srikarmk.hearth')
        minSdk 26
        targetSdk 34
        versionCode providers.gradleProperty('hearthVersionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('hearthVersionName').getOrElse('0.1.0')
    }

    signingConfigs {
        release {
            if (signing['storeFile']) {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signing['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
